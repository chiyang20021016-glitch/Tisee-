<title>点击后摇晃 Demo</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #0d0d0d;
  color: #eadcc4;
  font-family: Georgia, "Times New Roman", serif;
}

.wrap {
  text-align: center;
  padding: 24px;
}

.button {
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
}

.icon {
  width: min(48vw, 330px);
  height: auto;
  display: block;
  margin: auto;
  transform-origin: 50% 91%;
  user-select: none;
  -webkit-user-drag: none;
}

.icon.is-swaying {
  animation: swayOnce 1.8s ease-in-out;
}

@keyframes swayOnce {
  0%   { transform: rotate(0deg); }
  15%  { transform: rotate(-8deg); }
  30%  { transform: rotate(6deg); }
  45%  { transform: rotate(-5deg); }
  60%  { transform: rotate(4deg); }
  75%  { transform: rotate(-2deg); }
  100% { transform: rotate(0deg); }
}

p {
  opacity: .78;
  font-size: 14px;
  margin-top: 20px;
  line-height: 1.7;
}
</style>
